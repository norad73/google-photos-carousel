<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Photo Search Carousel</title>
    <style>
      body {
        margin: 0;
        width: 260px;
        padding: 16px;
        font: 14px/1.4 'Segoe UI', Roboto, Arial, sans-serif;
        color: #202124;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 600;
      }

      .version {
        margin: 0 0 12px;
        color: #4285f4;
        font-weight: 600;
      }

      p {
        margin: 0 0 8px;
        color: #5f6368;
        font-size: 13px;
      }

      ul {
        margin: 0;
        padding-left: 18px;
        color: #5f6368;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Photo Search Carousel</h1>
    <p class="version" id="version"></p>
    <p>Click any image in Google Images search results to open it full size in theatre mode.</p>
    <ul>
      <li>Left / Right arrows to browse</li>
      <li>Esc to close</li>
    </ul>
    <script src="popup.js"></script>
  </body>
</html>
